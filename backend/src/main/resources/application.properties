spring.application.name=aluguelcarros
server.port=${SERVER_PORT:8080}

# Banco (Supabase/PostgreSQL). Os valores vêm de variáveis de ambiente do Spring:
#   SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
# (o Spring Boot as lê automaticamente; veja backend/.env.example).
# Alternativa local: crie application-local.properties (ignorado pelo git) e rode com
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=local

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# Origens liberadas no CORS (front-end Vite)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
